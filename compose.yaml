services:
  db:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_DB: photograph
      POSTGRES_USER: photograph
      POSTGRES_PASSWORD: "photograph_dev_only"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: